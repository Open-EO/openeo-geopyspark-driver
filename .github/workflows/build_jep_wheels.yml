name: Build jep wheels

on:
  workflow_dispatch:
    inputs:
      jep_version:
        description: "jep version to build"
        required: true
        default: "4.1.2"
      release_tag:
        description: "GitHub release tag to publish the wheels to"
        required: true
        default: "jep-wheels"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.3.3,<2.5" setuptools wheel auditwheel patchelf
          python -m pip download --no-binary :all: --no-deps --no-build-isolation \
            "jep==${{ inputs.jep_version }}" -d sdist
          python -m pip wheel --no-build-isolation --no-deps sdist/*.tar.gz -w wheelhouse
          ls -l wheelhouse
      - name: Smoke test
        run: |
          # Jep can only be used embedded in Java, so test through a JVM.
          python -m pip install wheelhouse/*.whl
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          LIBDIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          LDLIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDLIBRARY'))")
          JAR=$(ls "$SITE"/jep/jep-*.jar | head -n1)
          cat > JepSmokeTest.java <<'EOF'
          import jep.Interpreter;
          import jep.SharedInterpreter;

          public class JepSmokeTest {
              public static void main(String[] args) throws Exception {
                  try (Interpreter interp = new SharedInterpreter()) {
                      interp.exec("import sys, numpy");
                      interp.exec("print(sys.version)");
                      interp.exec("print('numpy', numpy.__version__)");
                      interp.exec("assert int(numpy.__version__.split('.')[0]) >= 2");
                  }
              }
          }
          EOF
          LD_LIBRARY_PATH="$LIBDIR" LD_PRELOAD="$LIBDIR/$LDLIB" \
            "$JAVA_HOME/bin/java" -Djava.library.path="$SITE/jep" -cp "$JAR" JepSmokeTest.java
      - uses: actions/upload-artifact@v4
        with:
          name: jep-wheel-py${{ matrix.python-version }}
          path: wheelhouse/*.whl

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jep-wheel-py*
          path: wheels
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" \
              --notes "jep ${{ inputs.jep_version }} wheels (numpy>=2, JDK 21). Install: pip install --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/$TAG jep"
          gh release upload "$TAG" wheels/*.whl --clobber
