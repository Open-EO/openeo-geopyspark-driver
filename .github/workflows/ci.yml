name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENEO_JARS_VARIANT: "spark4-scala213"
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: "python"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_EXTRA_INDEX_URL: "https://artifactory.vgt.vito.be/artifactory/api/pypi/python-openeo/simple"
  # Precompiled jep wheels (see build_jep_wheels.yml)
  UV_FIND_LINKS: "https://github.com/Open-EO/openeo-geopyspark-driver/releases/expanded_assets/jep-wheels"

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (GDAL, NetCDF, HDF5)
        run: |
          sudo add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev \
            libnetcdf-dev netcdf-bin \
            libhdf5-dev \
            libkrb5-dev
          gdal-config --version
      - name: Symlink libgdal.so.38 -> system libgdal
        run: |
          set -e
          LIBDIR=/usr/lib/x86_64-linux-gnu
          ACTUAL=$(ls ${LIBDIR}/libgdal.so.[0-9]* | grep -E 'libgdal\.so\.[0-9]+$' | head -n1)
          echo "System libgdal: ${ACTUAL}"
          sudo ln -sf "${ACTUAL}" ${LIBDIR}/libgdal.so.38
          sudo ldconfig
          ls -l ${LIBDIR}/libgdal.so*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/setup.py
            **/pyproject.toml

      - name: Create virtualenv
        run: |
          # `--seed`: install pip/setuptools in the venv: UDF dependency handling (and its tests) run `python -m pip`
          uv venv .venv --seed --python "${{ env.pythonLocation }}/bin/python"
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install GDAL Python bindings (matching system libgdal)
        run: |
          uv pip install numpy setuptools wheel
          uv pip install --no-build-isolation "GDAL[numpy]==$(gdal-config --version).*"
          python -c "from osgeo import gdal, gdal_array; print('GDAL', gdal.__version__)"

      - name: Install project and test dependencies
        run: |
          uv pip install  -e ".[dev,spark40x]"
          python -c "import netCDF4, pyspark"

      - name: Download JARs
        run: |
          python scripts/get-jars.py --variant "${OPENEO_JARS_VARIANT}"

      - name: Show environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          python --version
          uv pip list

      - name: Smoke test jep
        run: |
          set -euo pipefail
          # Jep only works embedded in a JVM, so test it through a small Java program.
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          LIBDIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          LDLIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDLIBRARY'))")
          JAR=$(ls "$SITE"/jep/jep-*.jar | head -n1)
          echo "jep jar: $JAR; libpython: $LIBDIR/$LDLIB"
          ls -l "$SITE"/jep/
          cat > "$RUNNER_TEMP/JepSmokeTest.java" <<'EOF'
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.FloatBuffer;
          import jep.DirectNDArray;
          import jep.Interpreter;
          import jep.NDArray;
          import jep.SharedInterpreter;

          public class JepSmokeTest {
              static void check(boolean ok, String msg) {
                  if (!ok) throw new AssertionError(msg);
                  System.out.println("OK: " + msg);
              }

              static void run(String label) throws Exception {
                  System.out.println("--- " + label + " (thread " + Thread.currentThread().getName() + ")");
                  try (Interpreter interp = new SharedInterpreter()) {
                      interp.exec("import sys, numpy, jep");
                      System.out.println("python: " + interp.getValue("sys.version", String.class));
                      System.out.println("jep:    " + interp.getValue("jep.__version__", String.class));
                      String np = interp.getValue("numpy.__version__", String.class);
                      System.out.println("numpy:  " + np);
                      check(Integer.parseInt(np.split("\\.")[0]) >= 2, "numpy >= 2");

                      Long sum = interp.getValue("int(numpy.arange(10).sum())", Long.class);
                      check(sum == 45L, "numpy computation (sum=" + sum + ")");

                      // Java -> numpy (copy)
                      interp.set("a", new NDArray<>(new double[]{1, 2, 3, 4}, 2, 2));
                      Double s = interp.getValue("float(a.sum())", Double.class);
                      check(s == 10.0, "NDArray -> numpy (sum=" + s + ", shape=" + interp.getValue("str(a.shape)") + ")");

                      // numpy -> Java
                      Object back = interp.getValue("numpy.arange(6, dtype=numpy.float32).reshape(2, 3) * 2");
                      check(back instanceof NDArray, "numpy -> NDArray (" + back.getClass().getName() + ")");

                      // Java direct buffer <-> numpy (zero copy), as used for tile data
                      FloatBuffer buf = ByteBuffer.allocateDirect(4 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer();
                      for (int i = 0; i < 4; i++) buf.put(i, i);
                      interp.set("d", new DirectNDArray<>(buf, 4));
                      interp.exec("d *= 10");
                      check(buf.get(3) == 30.0f, "DirectNDArray in-place modification (" + buf.get(3) + ")");

                      // Python exceptions must map to JepException instead of crashing
                      try {
                          interp.exec("raise ValueError('expected')");
                          throw new AssertionError("no exception raised");
                      } catch (jep.JepException e) {
                          check(e.getMessage().contains("expected"), "Python exception -> JepException");
                      }
                  }
              }

              public static void main(String[] args) throws Exception {
                  run("main thread");
                  // Spark runs UDFs on executor threads: also test creating an interpreter on another thread.
                  Throwable[] err = new Throwable[1];
                  Thread t = new Thread(() -> {
                      try { run("worker thread"); } catch (Throwable e) { err[0] = e; }
                  }, "jep-worker");
                  t.start();
                  t.join();
                  if (err[0] != null) throw new RuntimeException(err[0]);
                  System.out.println("Jep smoke test passed");
              }
          }
          EOF
          PYTHONPATH="$SITE" LD_LIBRARY_PATH="$LIBDIR" LD_PRELOAD="$LIBDIR/$LDLIB" \
            java -Djava.library.path="$SITE/jep" -XX:ErrorFile="$RUNNER_TEMP/hs_err_smoke_%p.log" \
            -cp "$JAR" "$RUNNER_TEMP/JepSmokeTest.java" 2>&1 | tee "$RUNNER_TEMP/jep_smoke.log"
          grep -q "Jep smoke test passed" "$RUNNER_TEMP/jep_smoke.log"

      - name: Run tests
        env:
          OPENEO_TEST_JVM_CRASH_DIR: ${{ runner.temp }}/jvm-crash-logs
        run: |
          mkdir -p "$OPENEO_TEST_JVM_CRASH_DIR"
          # xdist crash isolation: if the Spark JVM dies (e.g. segfault), conftest.py hard-exits the worker,
          # xdist reports the test as crashed and starts a replacement worker (with a fresh JVM).
          # `--dist loadfile`: keep tests of a file on one worker (shared Spark/JVM fixtures).
          python -m pytest -ra -n 1 --dist loadfile --max-worker-restart=50 --junitxml=pytest-junit.xml

      - name: Publish test report (job summary + annotations)
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: pytest-junit.xml
          check_name: "Test report (Python ${{ matrix.python-version }})"
          # Only annotations + job summary: no `checks: write` needed, so it also works for fork PRs
          annotate_only: true
          job_summary: true
          detailed_summary: true
          include_passed: false
          require_tests: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-junit.xml
          if-no-files-found: ignore

      - name: Upload JVM crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-crash-logs-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/jvm-crash-logs/
            ${{ runner.temp }}/hs_err_*.log
            ${{ runner.temp }}/jep_smoke.log
          if-no-files-found: ignore

